server:
  servlet:
    context-path: /
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://auth-service:3000/
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: http://user-service:3000/
              predicates:
                - Path=/users/**
              filters:
                - StripPrefix=1
            - id: chat-service
              uri: http://chat-service:3000/
              predicates:
                - Path=/chat/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: http://notification-service:3000/
              predicates:
                - Path=/notifications/**
              filters:
                - StripPrefix=1

auth-service:
  url: http://auth-service:3000/
