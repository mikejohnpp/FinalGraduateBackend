server:
  servlet:
    context-path: /
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:9093/
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: http://localhost:9090/
              predicates:
                - Path=/users/**
              filters:
                - StripPrefix=1
            - id: chat-service
              uri: http://localhost:9091/
              predicates:
                - Path=/chat/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: http://localhost:9092/
              predicates:
                - Path=/notifications/**

auth-service:
  url: http://localhost:9093/
