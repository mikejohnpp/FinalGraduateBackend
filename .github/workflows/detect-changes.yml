name: Detect Changes

on:
  workflow_call:
    outputs:
      modules:
        description: "Changed modules as object array (module, dockerfile, context)"
        value: ${{ jobs.detect.outputs.modules }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          changed=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD)

          MODULES=$(sed 's/[[:space:]]*$//' modules.txt | grep -v '^$' | paste -sd '|')
          MODULES_LIST=$(sed 's/[[:space:]]*$//' modules.txt | grep -v '^$' | tr '\n' ' ')

          # Detect changed modules
          modules=$(echo "$changed" \
                | cut -d/ -f1 \
                | sort -u \
                | grep -E "^($MODULES)$" \
                | tr '\n' ' ')

          # If common/ changed, rebuild everything
          if echo "$changed" | grep -q "^common/"; then
            modules="$MODULES_LIST"
          fi

          # Build object array from modules-config.json
          modules_json=$(echo "$modules" | tr ' ' '\n' | grep -v '^$' | while read module; do
            jq --arg m "$module" '.[$m] + {module: $m}' modules-config.json
          done | jq -sc '.')

          echo "modules=$modules_json" >> $GITHUB_OUTPUT