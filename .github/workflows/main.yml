name: Main Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  detect:
    uses: ./.github/workflows/detect-changes.yml

  build:
    needs: detect
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.modules) }}
    uses: ./.github/workflows/build-module.yml
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    with:
      module: ${{ matrix.module }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}

  gitops-update:
    needs: [detect, build]
    uses: ./.github/workflows/gitops-update.yml
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    with:
      modules: ${{ needs.detect.outputs.modules }}
      sha: ${{ github.sha }}