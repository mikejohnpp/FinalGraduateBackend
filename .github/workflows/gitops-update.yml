name: GitOps Update

on:
  workflow_call:
    secrets:
      GITOPS_PAT:
        required: true
    inputs:
      modules:
        required: true
        type: string
        description: "JSON array of module names"
      sha:
        required: true
        type: string
        description: "Docker image tag (commit SHA)"

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
    steps:
      - name: Update GitOps repository
        shell: bash
        run: |
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

          rm -rf gitops
          git clone https://github.com/mikejohnpp/FinalGraduateProjectConfig.git gitops
          cd gitops

          echo '${{ inputs.modules }}' | jq -r '.[]' | while read module; do
            sed -i "s|image: ghcr.io/${{ github.repository_owner }}/${module}:.*|image: ghcr.io/${{ github.repository_owner }}/${module}:${{ inputs.sha }}|g" "${module}-app/deployment.yaml"
            git add "${module}-app/deployment.yaml"
          done

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git diff --cached --quiet && echo "Nothing to commit" && exit 0

          git commit -m "chore: update images to ${{ inputs.sha }}"
          git push -f "https://${GIT_TOKEN}@github.com/mikejohnpp/FinalGraduateProjectConfig.git" main
