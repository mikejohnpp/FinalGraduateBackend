server:
  port: 8080

spring:
  application:
    name: chat-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:100.120.5.8}
      port: ${REDIS_PORT:32034}
      password: ${REDIS_PASSWORD:default}
  datasource:
    url: ${DB_URL:jdbc:mysql://100.120.5.8:3306/FinalGraduateDB?zeroDateTimeBehavior=convertToNull}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:final-graduate-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092}
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: org.social.common.events,org.social.common.kafka.support
        spring.json.use.type.headers: false
        spring.json.value.default.type: org.social.common.kafka.support.EventEnvelope
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      missing-topics-fatal: false

app:
  kafka:
    topics:
      demo-ping: demo.ping
      demo-pong: demo.pong
      friend.accepted: friend.accepted
      chat.save: mess.saved

auth-service:
  url: http://auth-service:3000/
